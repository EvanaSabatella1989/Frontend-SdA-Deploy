<main class="admin-panel py-4">

  <div class="container">
  <div class="card shadow-lg rounded-4 p-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
  <h2 class="m-0 fw-bold text-white">Lista de Empleados</h2>

  <!-- Botón crear -->
  <div class="d-flex justify-content-end mb-3">
    <button class="btn btn-warning fw-bold" (click)="abrirModal()">
      + Nuevo Empleado
    </button>
  </div>

  </div>

  <div class="table-responsive-custom">

  <!-- Tabla -->
  <table class="table align-middle text-center custom-table">
    <thead>
      <tr>
        <th>Email</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Cargo</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      <!-- Recorre empleados -->
      <tr *ngFor="let empleado of empleados">

        <!-- Datos del empleado -->
        <td>{{ empleado.email }}</td>
        <td>{{ empleado.first_name }}</td>
        <td>{{ empleado.last_name }}</td>

        <!-- Mostramos el cargo guardado -->
        <td>{{ empleado.cargo }}</td>

        <!-- Botones -->
        <td>
          <button class="btn btn-sm btn-outline-warning me-2" (click)="abrirModal(empleado)"><i class="bi bi-pencil-fill"></i></button>

          <button class="btn btn-sm btn-outline-danger"
                  (click)="eliminarEmpleado(empleado.id)">
            <i class="bi bi-trash-fill"></i>
          </button>
        </td>

      </tr>
    </tbody>
  </table>
  </div>

  </div>

  <div class="d-flex justify-content-center mt-4">
    <a routerLink="/panel" class="btn btn-warning fw-bold">
      Volver al Panel
    </a>
  </div>

</div>

</main>


<!-- ================= MODAL ================= -->

<div class="modal fade" id="modalEmpleado" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title">
          {{ empleadoActual ? 'Editar Empleado' : 'Crear Empleado' }}
        </h5>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="modal">
        </button>
      </div>

      <!-- Body -->
      <div class="modal-body">

        <!-- Email -->
        <div class="mb-3">
          <label>Email</label>
          <input type="email"
                 class="form-control"
                 [(ngModel)]="email"
                 name="email">
        </div>

        <!-- Contraseña (solo al crear) -->
        <div class="mb-3" *ngIf="!empleadoActual">
          <label>Contraseña</label>
          <div class="input-group">

            <input [type]="showPassword ? 'text' : 'password'"
                   class="form-control"
                   [(ngModel)]="password"
                   name="password">

            <button class="btn btn-outline-secondary"
                    type="button"
                    (click)="togglePassword()">
              👁
            </button>

          </div>
        </div>

        <!-- Nombre -->
        <div class="mb-3">
          <label>Nombre</label>
          <input type="text"
                 class="form-control"
                 [(ngModel)]="first_name"
                 name="first_name">
        </div>

        <!-- Apellido -->
        <div class="mb-3">
          <label>Apellido</label>
          <input type="text"
                 class="form-control"
                 [(ngModel)]="last_name"
                 name="last_name">
        </div>

        <!-- ================== CARGO (CORREGIDO) ================== -->
        <!-- Ahora usamos SELECT y no input -->
        <div class="mb-3">
          <label>Área</label>

          <select class="form-control"
                  [(ngModel)]="cargoSeleccionada"
                  name="cargo"
                  required>

            <!-- Opción por defecto -->
            <option [ngValue]="undefined">
              Seleccione un área
            </option>

            <!-- Lista de cargos -->
            <option *ngFor="let c of cargo"
                    [value]="c">
              {{ c }}
            </option>

          </select>
        </div>

      </div>

      <!-- Footer -->
      <div class="modal-footer">

        <button class="btn btn-secondary"
                (click)="cerrarModal()">
          Cancelar
        </button>

        <button class="btn btn-success"
                (click)="guardarEmpleado()">
          {{ empleadoActual ? 'Actualizar' : 'Crear' }}
        </button>

      </div>

    </div>
  </div>
</div>
