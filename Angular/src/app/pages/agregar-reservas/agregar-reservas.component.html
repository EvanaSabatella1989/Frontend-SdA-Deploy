<main class="admin-panel py-4">
  <div *ngIf="isAdmin " class="container mt-5">
    <!-- <h2 class="text-center mb-4">Gestión de Reservas</h2> -->

<div class="card shadow-lg rounded-4 p-4">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
      <h2 class="m-0 fw-bold text-white">Gestión de Reservas</h2>
      <button class="btn btn-warning fw-semibold px-4" (click)="abrirModal()">+ Nueva Reserva</button>
    </div>
    
    <div class="table-responsive-custom">
    <table class="table align-middle text-center custom-table">
      <thead>
        <tr>
          <th scope="col">Cliente</th>
          <th scope="col">Servicio</th>
          <th scope="col">Sucursal</th>
          <th scope="col">Fecha</th>
          <th scope="col">Hora</th>
          <th scope="col">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of reservas">
          <td>{{ r.cliente.first_name }} {{ r.cliente.last_name }}</td>
          <td>{{ r.servicio_info?.nombre }}</td>
          <td>{{ r.sucursal_info?.nombre }}</td>
          <td>{{ r.turno_info?.fecha }}</td>
          <td>{{ r.turno_info?.hora }}</td>
          <!-- <td>
            <button class="btn btn-primary btn-sm me-2" (click)="abrirModal(r)">Editar</button>
            <button class="btn btn-danger btn-sm" (click)="eliminarReserva(r.id)">Eliminar</button>
          </td> -->

          <td data-label="Acciones">

              <div class="acciones-container">

                <button
                  class="btn btn-sm btn-outline-warning me-2"
                  (click)="abrirModal(r)">
                  <i class="bi bi-pencil-fill"></i>
                </button>

                <button
                  class="btn btn-sm btn-outline-danger"
                  (click)="eliminarReserva(r.id)">
                  <i class="bi bi-trash-fill"></i>
                </button>

              </div>

            </td>
        </tr>
      </tbody>
    </table>
    </div>
    </div>

    <!-- <div class="mb-3 d-flex justify-content-center">
    <a routerLink="/panel" class="btn btn-info">Volver</a>
  </div> -->


  <div class="d-flex justify-content-center mt-4">
    <a routerLink="/panel" class="btn btn-outline-light">
      Volver al Panel
    </a>
  </div>

  </div>

  </main>


  <!-- modal para dmin reserva, lo botones aparecen solo si hay reservas cargadas -->
  <div class="modal fade" id="modalReserva" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form [formGroup]="reservaForm" (ngSubmit)="guardarReserva()">
          <div class="modal-header">
            <h5 class="modal-title">{{ reservaActual ? 'Editar' : 'Nueva' }} Reserva</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Cliente</label>
              <select formControlName="cliente" class="form-control">
                <option *ngFor="let c of clientes" [value]="c.id">{{ c.first_name }} {{ c.last_name }}</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Servicio</label>
              <select formControlName="servicio" class="form-control" (change)="cargarServicios()">
                <option *ngFor="let s of servicios" [value]="s.id">{{ s.nombre }}</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Sucursal</label>
              <select formControlName="sucursal" class="form-control" (change)="alCambiarSucursal()">
                <option *ngFor="let s of sucursales" [value]="s.id">{{ s.nombre }}</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Turno</label>
              <select formControlName="turno" class="form-control">
                <option *ngFor="let t of turnosDisponibles" [value]="t.id">{{ t.fecha }} - {{ t.hora }}</option>
              </select>
            </div>
          </div>
          <!-- <div class="modal-footer">
            <button type="submit" class="btn btn-success">{{ reservaActual ? 'Actualizar' : 'Crear' }}</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          </div> -->
        </form>
        <div class="modal-footer custom-modal-footer">

        <button
          class="btn btn-secondary"
          data-bs-dismiss="modal">
          Cancelar
        </button>

        <button
          class="btn btn-success"
          (click)="guardarReserva()">
          Guardar
        </button>

      </div>

      </div>

      
    </div>
  </div>
