<main class="admin-panel py-4">

  <div class="container">

  <div class="card shadow-lg rounded-4 p-4"> 
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
  <h2 class="m-0 fw-bold text-white">Lista de Usuarios</h2>

  <div class="d-flex justify-content-end mb-3">
    <button class="btn btn-warning fw-bold" (click)="abrirModal()">+ Nuevo Usuario</button>
  </div>

  </div>

  <div class="table-responsive-custom">

  <table class="table align-middle text-center custom-table">
    <thead>
      <tr>
        <th scope="col">Email</th>
        <th scope="col">Nombre</th>
        <th scope="col">Dirección</th>
        <th scope="col">Teléfono</th>
        <th scope="col">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cliente of clientes">
        <td>{{ cliente.email }}</td>
        <td>{{ cliente.first_name }} {{ cliente.last_name }}</td>
        <td>{{ cliente.direccion }}</td>
        <td>{{ cliente.num_telefono }}</td>
        <td>
          <button class="btn btn-sm btn-outline-warning me-2" (click)="abrirModal(cliente)"><i class="bi bi-pencil-fill"></i></button>
          <button class="btn btn-sm btn-outline-danger" (click)="eliminarCliente(cliente)"><i class="bi bi-trash-fill"></i></button>
        </td>
      </tr>
    </tbody>
  </table>

  </div>

  
  </div>
  <div class="d-flex justify-content-center mt-4">
    <a routerLink="/panel" class="btn btn-warning fw-bold">
      Volver al Panel
    </a>
  </div>

</div>



</main>


<!-- modal para editar y crear -->
<div class="modal fade" id="modalCliente" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ clienteActual ? 'Editar Cliente' : 'Crear Cliente' }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <!-- <div class="alert alert-info">
          <strong>Campos obligatorios:</strong> Email, Contraseña, Nombre y Apellido.
        </div> -->
        <form>
          <div class="mb-3" *ngIf="!clienteActual">
            <label>Email</label>
            <input type="email" class="form-control" [(ngModel)]="email" name="email">
          </div>

          <div class="mb-3" *ngIf="!clienteActual">
            <label class="form-label">Contraseña</label>

            <div class="input-group">
              <input [type]="showPassword1 ? 'text' : 'password'" class="form-control" [(ngModel)]="password1"
                name="password1">

              <button class="btn btn-outline-secondary" type="button" (click)="togglePassword1()">
                <i class="bi" [ngClass]="showPassword1 ? 'bi-eye-slash' : 'bi-eye'"></i>
              </button>
            </div>
          </div>


          <div class="mb-3" *ngIf="!clienteActual">
            <label class="form-label">Confirmar Contraseña</label>

            <div class="input-group">
              <input [type]="showPassword2 ? 'text' : 'password'" class="form-control" [(ngModel)]="password2"
                name="password2">

              <button class="btn btn-outline-secondary" type="button" (click)="togglePassword2()">
                <i class="bi" [ngClass]="showPassword2 ? 'bi-eye-slash' : 'bi-eye'"></i>
              </button>
            </div>
          </div>


          <div class="mb-3">
            <label>Nombre</label>
            <input type="text" class="form-control" [(ngModel)]="first_name" name="first_name">
          </div>
          <div class="mb-3">
            <label>Apellido</label>
            <input type="text" class="form-control" [(ngModel)]="last_name" name="last_name">
          </div>
          <div class="mb-3">
            <label>Dirección</label>
            <input type="text" class="form-control" [(ngModel)]="direccion" name="direccion">
          </div>
          <div class="mb-3">
            <label>Teléfono</label>
            <input type="text" class="form-control" [(ngModel)]="num_telefono" name="num_telefono">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="cerrarModal()">Cancelar</button>
        <button class="btn btn-success" (click)="guardarCliente()">
          {{ clienteActual ? 'Actualizar' : 'Crear' }}
        </button>
      </div>
    </div>
  </div>
</div>
