<main class="admin-panel py-4">
  <div class="container">

    <h4 class="admin-title mb-4 text-center">Editar Producto</h4>

    <form
      (ngSubmit)="actualizar()"
      class="form-admin mx-auto"
      enctype="multipart/form-data">

      <!-- NOMBRE -->
      <div class="mb-3">
        <label class="form-label">Nombre del Producto</label>
        <input
          type="text"
          class="form-control"
          name="nombre"
          [(ngModel)]="productos.nombre"
          #nombre="ngModel"
          required
        />
        <div class="text-danger mt-1" *ngIf="nombre.invalid && nombre.touched">
          El nombre es obligatorio
        </div>
      </div>

      <!-- IMAGEN -->
      <div class="mb-3">
        <label class="form-label">Imagen actual</label>
        <div class="mb-2 text-center">
          <img [src]="productos.imagen" class="imagen-preview" />
        </div>
        <input
          class="form-control"
          type="file"
          name="imagen"
          (change)="enviarFoto($event)"
        />
      </div>

      <!-- DESCRIPCIÓN -->
      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea
          class="form-control"
          rows="3"
          name="descripcion"
          [(ngModel)]="productos.descripcion"
          #descripcion="ngModel"
          required>
        </textarea>
        <div class="text-danger mt-1" *ngIf="descripcion.invalid && descripcion.touched">
          La descripción es obligatoria
        </div>
      </div>

      <!-- PRECIO -->
      <div class="mb-3">
        <label class="form-label">Precio</label>
        <input
          type="number"
          class="form-control"
          name="precio"
          [(ngModel)]="productos.precio"
          #precio="ngModel"
          min="0"
          required
        />
        <div class="text-danger mt-1" *ngIf="precio.invalid && precio.touched">
          El precio no puede ser menor a 0
        </div>
      </div>

      <!-- CANTIDAD -->
      <div class="mb-3">
        <label class="form-label">Cantidad</label>
        <input
          type="number"
          class="form-control"
          name="cantidad"
          [(ngModel)]="productos.cantidad"
          #cantidad="ngModel"
          min="0"
          required
        />
        <div class="text-danger mt-1" *ngIf="cantidad.invalid && cantidad.touched">
          La cantidad no puede ser menor a 0
        </div>
      </div>

      <!-- CATEGORÍA -->
      <div class="mb-4">
        <label class="form-label">Categoría</label>

        <div class="d-flex gap-2">
          <select
            class="form-select"
            name="categoria"
            [(ngModel)]="categoriaSeleccionada">
            <option *ngFor="let cat of categorias" [ngValue]="cat.id">
              {{ cat.nombre }}
            </option>
          </select>

          <a routerLink="/categorias" class="btn btn-outline-warning">
            +
          </a>
        </div>
      </div>

      <!-- BOTONES -->
      <div class="d-flex justify-content-center gap-3">
        <button type="submit" class="btn btn-warning fw-bold">
          Guardar
        </button>

        <a routerLink="/lista-productos" class="btn btn-outline-light">
          Volver
        </a>
      </div>

    </form>
  </div>
</main>
