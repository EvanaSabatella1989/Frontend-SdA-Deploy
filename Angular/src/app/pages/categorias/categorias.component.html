<main class="admin-panel py-4">
  <div class="container">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="admin-title m-0">Categorías</h4>

      <button class="btn btn-success fw-bold" (click)="abrirModal()">
        + Nueva Categoría
      </button>
    </div>

    <!-- FILTROS -->
    <div class="btn-group mb-3" role="group">
      <button
        class="btn"
        [ngClass]="tipoCategoria === 'producto' ? 'btn-warning' : 'btn-outline-warning'"
        (click)="tipoCategoria='producto'; cargarCategorias()">
        Productos
      </button>

      <button
        class="btn"
        [ngClass]="tipoCategoria === 'servicio' ? 'btn-warning' : 'btn-outline-warning'"
        (click)="tipoCategoria='servicio'; cargarCategorias()">
        Servicios
      </button>
    </div>

    <!-- INFO -->
    <p *ngIf="tipoCategoria === 'servicio'" class="alert alert-info small">
      Aquí podés cargar los tipos de vehículos que maneja el taller
    </p>

    <!-- TABLA -->
    <div class="table-responsive">
      <table class="table table-dark table-hover align-middle">

        <thead>
          <tr>
            <th>Nombre</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let item of miCat">
            <td>{{ item.nombre }}</td>

            <td class="text-center">
              <button
                class="btn btn-sm btn-outline-warning me-2"
                (click)="abrirModal(item)">
                <i class="bi bi-pencil-fill"></i>
              </button>

              <button
                class="btn btn-sm btn-outline-danger"
                (click)="delete(item)">
                <i class="bi bi-trash-fill"></i>
              </button>
            </td>
          </tr>
        </tbody>

      </table>
    </div>

    <!-- VOLVER -->
    <div class="d-flex justify-content-center mt-4">
      <a routerLink="/panel" class="btn btn-warning fw-bold">
        Volver al Panel
      </a>
    </div>

  </div>
</main>

<!-- MODAL -->
<div class="modal fade" id="modalCategoria" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title text-uppercase fw-bold">
          {{ editando ? 'Editar Categoría' : 'Nueva Categoría' }}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form (ngSubmit)="guardarCategoria()" #formCategoria="ngForm">

          <div class="mb-3">
            <label class="form-label">Nombre de la categoría</label>
            <input
              type="text"
              class="form-control"
              name="nombre"
              [(ngModel)]="nombre"
              maxlength="50"
              required
              (ngModelChange)="verificarDuplicado()"
            />

            <small *ngIf="nombreDuplicado" class="text-danger">
              Ya existe una categoría con este nombre
            </small>
          </div>

          <div class="mb-3">
            <label class="form-label">Tipo</label>
            <input
              type="text"
              class="form-control"
              name="tipo"
              [(ngModel)]="tipo"
              readonly
            />
          </div>

          <button
            type="submit"
            class="btn btn-warning fw-bold"
            [disabled]="formCategoria.invalid || nombreDuplicado">
            {{ editando ? 'Actualizar' : 'Guardar' }}
          </button>

        </form>
      </div>

    </div>
  </div>
</div>
