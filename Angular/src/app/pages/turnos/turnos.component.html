<main class="admin-panel py-4">

<div class="container" *ngIf="isAdmin">

  <div class="card shadow-lg rounded-4 p-4">

    
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
      <h2 class="m-0 fw-bold text-white">Gestión de Turnos</h2>

      <!-- filtro para ver todos los turnos creados -->
      <div class="form-check form-switch mt-2">
      <input class="form-check-input" type="checkbox" 
             [checked]="verTodos"
             (change)="toggleVerTodos()">
      <label class="form-check-label text-white">Ver turnos pasados</label>
    </div>

      <button class="btn btn-warning fw-semibold px-4" (click)="abrirModalGenerar()">
      ⚡ Generar Turnos automaticos
    </button>

      <button class="btn btn-warning fw-semibold px-4" (click)="abrirModal()">
        + Generar Turnos manualmente
      </button>

      <button class="btn btn-danger fw-semibold px-4" 
          *ngIf="turnosSeleccionados.size > 0"
          (click)="eliminarSeleccionados()">
    🗑 Eliminar ({{ turnosSeleccionados.size }})
  </button>
    </div>

    
    <div class="table-responsive-custom">

      <table class="table align-middle text-center custom-table">

        <thead>
          <tr>
             <th>
      <input type="checkbox" 
             (change)="seleccionarTodos()"
             [checked]="turnosSeleccionados.size === turnos.length && turnos.length > 0">
    </th>
            <th>Sucursal</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Disponible</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let turno of turnos" [ngClass]="{'table-active': turnosSeleccionados.has(turno.id!)}">

             <td>
    <input type="checkbox"
           [checked]="turnosSeleccionados.has(turno.id!)"
           (change)="toggleSeleccion(turno.id!)">
  </td>

            <td data-label="Sucursal">
              {{ turno.sucursal?.nombre || 'N/A' }}
            </td>

            <td data-label="Fecha">
              {{ turno.fecha }}
            </td>

            <td data-label="Hora">
              {{ turno.hora }}
            </td>

            <td data-label="Disponible">
              {{ turno.disponible ? '✅' : '❌' }}
            </td>

            <td data-label="Acciones">

              <div class="acciones-container">

                <button
                  class="btn btn-sm btn-outline-warning me-2"
                  (click)="abrirModal(turno)">
                  <i class="bi bi-pencil-fill"></i>
                </button>

                <button
                  class="btn btn-sm btn-outline-danger"
                  (click)="eliminarTurno(turno.id)">
                  <i class="bi bi-trash-fill"></i>
                </button>

              </div>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

  
  <div class="d-flex justify-content-center mt-4">
    <a routerLink="/panel" class="btn btn-outline-light">
      Volver al Panel
    </a>
  </div>

</div>

</main>





<div class="modal fade" id="modalTurno" tabindex="-1" aria-hidden="true">

  <div class="modal-dialog">
    <div class="modal-content">

      
      <div class="modal-header">
        <h5 class="modal-title">
          {{ turnoActual?.id ? 'Editar Turno' : 'Nuevo Turno' }}
        </h5>

        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      
      <div class="modal-body">

        <form [formGroup]="formTurno">

          <div class="mb-3">
            <label class="form-label">Sucursal</label>

            <select formControlName="sucursal" class="form-control">

              <option [ngValue]="null">
                Seleccione una sucursal
              </option>

              <option *ngFor="let suc of sucursales"
                [ngValue]="suc.id">{{ suc.nombre }}</option>

            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Fecha</label>

            <input
              type="date"
              formControlName="fecha"
              class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label">Hora</label>

            <input
              type="time"
              formControlName="hora"
              class="form-control">
          </div>

          <div class="form-check mt-3">

            <input
              type="checkbox"
              class="form-check-input"
              formControlName="disponible">

            <label class="form-check-label">
              Disponible
            </label>

          </div>

        </form>

      </div>

     
      <div class="modal-footer custom-modal-footer">

        <button
          class="btn btn-secondary"
          data-bs-dismiss="modal">
          Cancelar
        </button>

        <button
          class="btn btn-success"
          (click)="guardarTurno()">
          Guardar
        </button>

      </div>

    </div>
  </div>

</div>

<div class="modal fade" id="modalGenerar" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Generar Turnos del Día</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form [formGroup]="formGenerar">

          <div class="mb-3">
            <label class="form-label">Sucursal</label>
            <select formControlName="sucursal_id" class="form-control">
              <option [ngValue]="null">Seleccione una sucursal</option>
              <option *ngFor="let suc of sucursales" [ngValue]="suc.id">
                {{ suc.nombre }}
              </option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Fecha</label>
            <input type="date" formControlName="fecha" class="form-control">
          </div>

        </form>
      </div>

      <div class="modal-footer custom-modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-info" (click)="generarTurnos()">Generar</button>
      </div>

    </div>
  </div>
</div>
