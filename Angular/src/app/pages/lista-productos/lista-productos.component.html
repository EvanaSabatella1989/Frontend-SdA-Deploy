<h4>Lista de Productos</h4>
<div class="container"> 

<!-- MENSAJE SIN PRODUCTOS -->
  <div *ngIf="miProd.length === 0" class="alert alert-info text-center">
    No hay productos cargados.
  </div>

  <!-- BOTÓN AGREGAR -->
  <div class="row mb-3">
    <div class="col text-center">
      <a routerLink="/agregar-productos" class="btn btn-info">
        Agregar Producto
      </a>
    </div>
  </div>

  
<div class="row mb-3">
    <div class="col-md-4 mx-auto">
  <input
  type="text"
  class="form-control"
  placeholder="Buscar producto por nombre..."
  [(ngModel)]="busquedaNombre"
  (input)="buscarPorNombre()"
/>
</div>

<div class="col-md-4 mx-auto">
        <select
      class="form-select"
      [(ngModel)]="categoriaSeleccionada"
      (change)="filtrarPorCategoria()"
    >
      <option [ngValue]="'todas'">Todas las categorías</option>

      <option
        *ngFor="let cat of categorias"
        [ngValue]="cat.id"
      >
        {{ cat.nombre }}
      </option>
    </select>
    </div>

</div>

  <div *ngIf="productosFiltrados.length === 0" class="alert alert-warning text-center">
  No se encontraron productos.
</div>

  


<!-- TABLA CUANDO HAY PRODUCTOS -->
<div class="row" *ngIf="productosFiltrados.length > 0">

 

  

  <div class="col">
<table class="table">
    <thead>
      <tr>
        <!-- <th scope="col">Id</th> -->
        <th scope="col">Nombre</th>
        <th scope="col">Imagen</th>
        <th scope="col" class="col-descripcion">Descripción</th>
        <th scope="col">Precio</th>
        <th scope="col">Cantidad</th>
        <!-- <th scope="col">Fecha Creación</th> -->
        <th scope="col">Categoria</th>
        <th scope="col">Editar</th>
        <th scope="col">Eliminar</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of productosFiltrados">
        <!-- <th scope="row">{{item.id}}</th> -->
        <td>{{item.nombre}}</td>
        <td><img src="{{item.imagen}}" alt="{{item.imagen}}"></td>
        <td class="col-descripcion" title="{{ item.descripcion }}">{{item.descripcion}}</td>
        <td>${{item.precio}}</td>
        <td>{{item.cantidad}}</td>
        <!-- <td>{{item.fecha_creacion}}</td> -->
        <!-- <td>{{ getNombreCategoria(item.categoria) }}</td> -->
        <td>{{ getNombreCategoria(item.categoria) }}</td>
        <td><a ><i class="bi bi-pencil-fill" id="edit" routerLink="/editar-productos/{{item.id}}"></i></a></td>
        <td><a (click)=eliminar(item) ><i class="bi bi-trash-fill" id="borrar"></i></a></td>
        
        
        
      </tr>
      
      
    </tbody>
  </table>
  </div>
</div>

<!-- <a routerLink="/productos" class="btn btn-info">Volver</a> -->
 <!-- BOTÓN VOLVER -->
  <div class="row mt-4">
    <div class="col text-center">
      <a routerLink="/productos" class="btn btn-info">
        Volver
      </a>
    </div>
  </div>
  
</div>
