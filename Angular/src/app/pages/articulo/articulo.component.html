<main class="admin-panel py-5">
  <div class="container my-5">

    <div class="card producto-detalle-card p-3">
      <div class="row g-4 align-items-center">

        <!-- Imagen -->
        <div class="col-md-5 text-center">
          <img
            [src]="productos.imagen"
            class="producto-detalle-img"
            alt="{{ productos.nombre }}"
          />
        </div>

        <!-- Detalles -->
        <div class="col-md-7">
          <h2 class="producto-title">{{ productos.nombre }}</h2>

          <p class="producto-precio">${{ productos.precio }}</p>

          <h6 class="producto-subtitle">Descripción</h6>
          <p class="producto-desc">{{ productos.descripcion }}</p>

          <h6 class="producto-subtitle">
            <ng-container *ngIf="sinStock; else conStock">
              <span class="text-danger fw-bold">Sin stock</span>
            </ng-container>

            <ng-template #conStock>
              Stock disponible: {{ productos.cantidad }}
              <span *ngIf="ultimoDisponible" class="text-warning fw-bold ms-2">
                Último disponible
              </span>
            </ng-template>
          </h6>

          <!-- Botones -->
          <div class="d-flex flex-wrap gap-2 mt-3">

            <button
              *ngIf="!isAdmin && !isInCart(productos.id)"
              class="btn btn-primary"
              (click)="agregarCarrito()"
              [disabled]="sinStock">
              Añadir al carrito
            </button>

            <button
              *ngIf="isInCart(productos.id)"
              class="btn btn-primary"
              routerLink="/carrito">
              Ver carrito
            </button>

            <a routerLink="/productos" class="btn btn-outline-secondary">
              Volver
            </a>

          </div>

        </div>

      </div>
    </div>

  </div>
</main>
