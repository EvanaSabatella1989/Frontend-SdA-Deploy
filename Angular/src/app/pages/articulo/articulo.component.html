<!--Main layout-->
<main class="mt-5 pt-4">
  <div class="container mt-5">
    <!--Grid row-->
    <div class="row">
      <!--Grid column-->
      <div class="col-md-6 mb-4">
        <img src="{{ productos.imagen }}" class="img-fluid" alt="" />
      </div>
      <!--Grid column-->

      <!--Grid column-->
      <div class="col-md-6 mb-4">
        <!--Content-->
        <div class="p-4">
          <div class="mb-3">
            <strong
              ><h1>{{ productos.nombre }}</h1></strong
            >
          </div>

          <p class="lead">
            <span class="me-1"> </span>
            <span>${{ productos.precio }}</span>
          </p>

          <strong><p style="font-size: 20px">Descripción</p></strong>

          <p>{{ productos.descripcion }}</p>

          <!-- <strong><p style="font-size: 20px">Stock disponible: {{productos.cantidad}}</p></strong> -->
          
          <strong>
            <p style="font-size: 20px">
              <ng-container *ngIf="sinStock; else conStock">
                <span class="text-danger fw-bold">Sin stock</span>
              </ng-container>

              <ng-template #conStock>
                Stock disponible: {{ productos.cantidad }}
                <span *ngIf="ultimoDisponible" class="text-warning fw-bold ms-2">
                  Último disponible
                </span>
              </ng-template>
            </p>
          </strong>
          
          <br />

          <form class="d-flex justify-content-left">
            <!-- Default input -->
            
            <div *ngIf="!isInCart(productos.id) " class="d-flex justify-content-left">
              <!-- <div class="form-outline me-1" style="width: 100px">
                <input type="number" [(ngModel)]="cantidad" (input)="guardarCantidad($event)" value="1" min="1" class="form-control" />
              </div> -->


            <!-- <button *ngIf="!isAdmin"
              class="btn btn-primary shadow-0 me-1"
              (click)="agregarCarrito()"
            >
              Añadir al carrito
            </button> -->

            <button
            *ngIf="!isAdmin && !isInCart(productos.id)"
            class="btn btn-primary shadow-0 me-1"
            (click)="agregarCarrito()"
            [disabled]="sinStock">
            Añadir al carrito
          </button>

          </div>
          <div *ngIf="isInCart(productos.id)">
            <button 
              class="btn btn-primary shadow-0 me-1" 
              routerLink="/carrito"
              >
              Ver carrito
            </button>
          </div>
            
            <a routerLink="/productos" type="button" class="btn btn-secondary"
              >Volver</a
            >
          </form>
        </div>
        <!--Content-->
      </div>
      <!--Grid column-->
    </div>
    <!--Grid row-->

    <hr />
  </div>

<!--Main layout-->
