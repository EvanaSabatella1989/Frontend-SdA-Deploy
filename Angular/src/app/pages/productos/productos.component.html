    <header class="mb-4 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
  <h3 class="m-0">
    Productos <span class="cat-selec">{{ catSelec.nombre }}</span>
  </h3>

  <div class="d-flex gap-2">
    <div class="dropdown">
      <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">
        Categorías
      </button>
      <ul class="dropdown-menu">
        <li>
          <button class="dropdown-item" (click)="filtrarPorCategoria({id:0, nombre:''})">
            Todas
          </button>
        </li>
        <li *ngFor="let cat of categorias">
          <button class="dropdown-item" (click)="filtrarPorCategoria(cat)">
            {{ cat.nombre }}
          </button>
        </li>
      </ul>
    </div>
  </div>
</header>

<div *ngIf="productosFiltrados.length === 0" class="col-12">
<div class="alert alert-warning text-center py-4">
No hay productos para la categoría seleccionada
</div>
</div>
  
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3">
      <div *ngFor="let prod of productosFiltrados" class="col d-flex">
        <div class="card w-100 my-2 shadow-2-strong">
          <div class="card-img-wrapper">
            <img [src]="prod.imagen" class="card-img-top" />
          </div>
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{prod.nombre}}</h5>
            <p class="card-text">${{prod.precio}}</p>
            <div class="card-footer d-flex align-items-end pt-3 px-0 pb-0 mt-auto">
              <button class="btn btn-primary shadow-0 me-1 w-100" [routerLink]="'/articulo/' + prod.id">
                Ver detalle
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
