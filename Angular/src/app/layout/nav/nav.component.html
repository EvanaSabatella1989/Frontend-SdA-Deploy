

<header class="admin-header">
  <nav class="navbar navbar-expand-lg navbar-dark admin-navbar p-3 border-bottom">
    <div class="container">

      <!-- LOGO -->
      <a routerLink="/home" class="navbar-brand">
        <img
          src="assets/otros/logoSdA.png"
          width="100"
          height="40"
          alt="Logo">
      </a>

      <!-- BOTÓN HAMBURGUESA -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarContent"
        aria-controls="navbarContent"
        aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- MENÚ COLAPSABLE -->
      <div class="collapse navbar-collapse" id="navbarContent">

        <!-- LINKS -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 admin-nav-links">
          <li class="nav-item">
            <a routerLink="/home" class="nav-link" data-bs-toggle="collapse" data-bs-target="#navbarContent">Home</a>
          </li>
          <li class="nav-item">
            <a routerLink="/servicios" class="nav-link" data-bs-toggle="collapse" data-bs-target="#navbarContent">Servicios</a>
          </li>
          <li class="nav-item">
            <a routerLink="/productos" class="nav-link" data-bs-toggle="collapse" data-bs-target="#navbarContent">Productos</a>
          </li>
          <li class="nav-item">
            <a routerLink="/sucursales" class="nav-link" data-bs-toggle="collapse" data-bs-target="#navbarContent">Sucursales</a>
          </li>
          <li class="nav-item">
            <a routerLink="/contacto" class="nav-link" data-bs-toggle="collapse" data-bs-target="#navbarContent">Contacto</a>
          </li>
          <li class="nav-item">
            <a routerLink="/quienes-somos" class="nav-link" data-bs-toggle="collapse" data-bs-target="#navbarContent">Nosotros</a>
          </li>
        </ul>

        <!-- USUARIO NO LOGUEADO -->
        <div class="d-flex gap-2" *ngIf="!isLogged">
          <button
            routerLink="/login"
            class="btn btn-outline-warning"
            data-bs-toggle="collapse"
            data-bs-target="#navbarContent">
            Ingresar
          </button>
          <button
            routerLink="/registrarse"
            class="btn btn-warning fw-bold"
            data-bs-toggle="collapse"
            data-bs-target="#navbarContent">
            Registrarse
          </button>
        </div>

        <!-- USUARIO LOGUEADO -->
        <div class="d-flex align-items-center gap-3" *ngIf="isLogged">

          <!-- CARRITO -->
          <a
            *ngIf="!isAdmin"
            routerLink="/carrito"
            class="admin-cart"
            data-bs-toggle="collapse"
            data-bs-target="#navbarContent">
            <i class="bi bi-cart3 fs-4"></i>
          </a>

          <!-- AVATAR -->
          <img
            src="assets/otros/avatar.png"
            class="rounded-circle admin-avatar"
            width="44"
            height="44">

          <!-- DROPDOWN -->
          <div class="dropdown">
            <a
              class="btn btn-secondary admin-user-btn dropdown-toggle"
              data-bs-toggle="dropdown">
              {{ userName }}
            </a>

            <ul class="dropdown-menu dropdown-menu-end admin-dropdown">
              <li *ngIf="isAdmin">
                <a class="dropdown-item" routerLink="/panel" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                  Panel Admin
                </a>
              </li>
              <li>
                <a class="dropdown-item" routerLink="/perfil" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                  Perfil
                </a>
              </li>
              <li>
                <button class="dropdown-item" (click)="logout()" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                  Cerrar sesión
                </button>
              </li>
            </ul>
          </div>

        </div>

      </div>
    </div>
  </nav>
</header>
